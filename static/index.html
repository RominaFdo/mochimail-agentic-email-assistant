<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mochimail · your fluffy inbox helper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>" />
</head>
<body>
  <!-- Shared SVG definitions: the Mochi mascot is drawn once and reused everywhere -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="furGrad" cx="45%" cy="36%" r="68%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="55%" stop-color="#f4f2ff" />
        <stop offset="84%" stop-color="#cdd6ff" />
        <stop offset="100%" stop-color="#9eb0ff" />
      </radialGradient>
      <filter id="fluff" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3.5" result="b" />
        <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>
    </defs>
    <symbol id="mochi" viewBox="0 0 200 200">
      <g filter="url(#fluff)">
        <path d="M48 82 Q50 30 64 20 Q84 36 98 60 Z" fill="url(#furGrad)" />
        <path d="M152 82 Q150 30 136 20 Q116 36 102 60 Z" fill="url(#furGrad)" />
        <ellipse cx="100" cy="114" rx="72" ry="64" fill="url(#furGrad)" />
      </g>
      <path d="M62 64 Q63 40 69 34 Q80 45 87 58 Z" fill="#ffb8d6" opacity=".75" />
      <path d="M138 64 Q137 40 131 34 Q120 45 113 58 Z" fill="#ffb8d6" opacity=".75" />
      <g class="eyes">
        <ellipse cx="76" cy="110" rx="8" ry="10" fill="#1b1638" />
        <ellipse cx="124" cy="110" rx="8" ry="10" fill="#1b1638" />
        <circle cx="79" cy="106" r="3" fill="#fff" />
        <circle cx="127" cy="106" r="3" fill="#fff" />
      </g>
      <ellipse cx="60" cy="127" rx="12" ry="7" fill="#ff9cc2" opacity=".7" />
      <ellipse cx="140" cy="127" rx="12" ry="7" fill="#ff9cc2" opacity=".7" />
      <path d="M91 122 Q95.5 129 100 123 Q104.5 129 109 122" stroke="#1b1638" stroke-width="2.6" fill="none" stroke-linecap="round" />
      <g transform="translate(77 140) rotate(-4 23 15)">
        <rect x="0" y="0" width="46" height="31" rx="5" fill="#ffe0ee" stroke="#f49ac1" stroke-width="2" />
        <path d="M3 4 L23 19 L43 4" stroke="#f49ac1" stroke-width="2" fill="none" stroke-linejoin="round" />
        <path d="M23 24 C17 19 18 14 21 14 C22.5 14 23 15.5 23 15.5 C23 15.5 23.5 14 25 14 C28 14 29 19 23 24 Z" fill="#ff6fa8" />
      </g>
      <ellipse cx="78" cy="160" rx="10" ry="7.5" fill="#fbfaff" />
      <ellipse cx="122" cy="160" rx="10" ry="7.5" fill="#fbfaff" />
    </symbol>
  </svg>

  <div class="app">
    <!-- ───────────── Sidebar: folders + mail list ───────────── -->
    <aside class="sidebar">
      <div class="brand">
        <svg class="brand-mochi"><use href="#mochi" /></svg>
        <div>
          <div class="brand-name">mochimail</div>
          <div class="brand-sub" id="me">—</div>
        </div>
      </div>

      <button class="new-btn" id="newBtn">✿ Ask Mochi</button>

      <nav class="folders" role="tablist">
        <button class="folder active" data-folder="inbox" role="tab">📬 Inbox <span class="count" id="c-inbox">0</span></button>
        <button class="folder" data-folder="unread" role="tab">💌 Unread <span class="count" id="c-unread">0</span></button>
        <button class="folder" data-folder="sent" role="tab">🕊️ Sent <span class="count" id="c-sent">0</span></button>
      </nav>

      <div class="mail-list" id="mailList" aria-live="polite"></div>

      <div class="side-foot">
        <button class="ghost-btn" id="resetBtn" title="Restore the mock inbox">🌱 Reset inbox</button>
        <span class="model-pill" id="modelPill">model</span>
      </div>
    </aside>

    <!-- ───────────── Main stage: garden + chat ───────────── -->
    <main class="main">
      <div class="sky" id="sky"></div>
      <svg class="garden" id="garden" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
      <div class="petals" id="petals" aria-hidden="true"></div>

      <div class="stage">
        <section class="hero" id="hero">
          <div class="mascot-wrap">
            <div class="mascot-glow"></div>
            <svg class="mascot" id="mascot"><use href="#mochi" /></svg>
          </div>
          <h1 class="title">MOCHIMAIL</h1>
          <p class="tagline">your fluffy little inbox helper ✧ just tell me what to do</p>
        </section>

        <section class="thread" id="thread" aria-live="polite"></section>

        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Message Mochi… e.g. “delete the happy hour email”" aria-label="Message the agent"></textarea>
          <div class="chips" id="chips">
            <button type="button" class="chip">💼 Check unread from boss@email.com, mark read & reply politely</button>
            <button type="button" class="chip">🗑️ Delete the Happy Hour email</button>
            <button type="button" class="chip">🍱 Tell Alice yes to lunch</button>
            <button type="button" class="chip">📋 Summarize my unread emails</button>
          </div>
          <div class="composer-bar">
            <span class="auto-pill" title="The agent acts without asking for confirmation">🐾 Auto-acts</span>
            <span class="spacer"></span>
            <span class="hint">Enter to send · Shift+Enter for new line</span>
            <button type="submit" class="send" id="sendBtn" aria-label="Send">
              <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
          </div>
        </form>
      </div>

      <!-- Reader drawer -->
      <aside class="reader" id="reader" aria-hidden="true">
        <button class="reader-close" id="readerClose" aria-label="Close">✕</button>
        <div id="readerBody"></div>
      </aside>

      <div class="toast" id="toast"></div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
